<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>love you 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<script>
var bg = document.getElementById("bg"), fg = document.getElementById("fg");
var bx = bg.getContext("2d"), fx = fg.getContext("2d");
var W, H, dpr, fs = 16, cols, drops, speeds, TXT = "love you ";

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  [bg, fg].forEach(function(c){ c.width = W * dpr; c.height = H * dpr; });
  bx.setTransform(dpr,0,0,dpr,0,0); fx.setTransform(dpr,0,0,dpr,0,0);
  bx.fillStyle = "#000"; bx.fillRect(0,0,W,H);
  cols = Math.ceil(W / fs);
  drops = []; speeds = [];
  for(var i = 0; i < cols; i++){ drops.push(Math.random() * -40); speeds.push(0.35 + Math.random() * 0.7); }
}
window.addEventListener("resize", resize);
resize();

function rain(){
  bx.fillStyle = "rgba(0,0,0,.14)";
  bx.fillRect(0,0,W,H);
  bx.font = "bold " + fs + "px monospace";
  bx.textAlign = "center";
  for(var i = 0; i < cols; i++){
    var row = Math.floor(drops[i]);
    var ch = TXT.charAt(((row + i * 3) % TXT.length + TXT.length) % TXT.length);
    var x = i * fs + fs / 2, y = row * fs;
    if(row >= 0 && ch !== " "){
      bx.fillStyle = "#ff9ec0";
      bx.shadowColor = "#ff2d6f"; bx.shadowBlur = 8;
      bx.fillText(ch, x, y);
      bx.shadowBlur = 0;
    }
    drops[i] += speeds[i];
    if(y > H && Math.random() > 0.96){ drops[i] = Math.random() * -12; }
  }
}

function heartPath(c, cx, cy, s){
  c.beginPath();
  for(var t = 0; t <= Math.PI * 2 + 0.03; t += 0.03){
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    var px = cx + x * s, py = cy - y * s;
    if(t === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

var N = 28, t0 = performance.now(), lastRain = 0, fontReady = false, textStart = null;
try{ document.fonts.load("700 100px 'Dancing Script'", "LOVE YOU JAWA").then(function(){ fontReady = true; }, function(){ fontReady = true; }); }catch(e){ fontReady = true; }
function frame(now){
  var t = (now - t0) / 1000;
  if(now - lastRain > 45){ rain(); lastRain = now; }

  fx.clearRect(0,0,W,H);
  var size = Math.min(W, H * 0.9) * 0.0215;
  var s = size;
  var cx = W / 2, cy = H / 2 - 2.5 * s;

  var total = 220;
  var shown = Math.min(total, Math.floor(t * 70) + 1);
  fx.save();
  heartPath(fx, cx, cy, s);
  fx.fillStyle = "rgba(0,0,0,.5)";
  fx.fill();
  fx.restore();

  var tipX = cx, tipY = cy + 17 * s;
  fx.lineWidth = 1.1;
  fx.shadowColor = "#ff2d6f";
  fx.shadowBlur = 5;
  for(var j = 0; j < shown; j++){
    var side = (j % 2 === 0) ? 1 : -1;
    var step = Math.floor(j / 2) + 1;
    var tt = Math.PI + side * step * (Math.PI / 110);
    var hx = 16 * Math.pow(Math.sin(tt), 3);
    var hy = 13*Math.cos(tt) - 5*Math.cos(2*tt) - 2*Math.cos(3*tt) - Math.cos(4*tt);
    var wv = 0.5 + 0.5 * Math.sin(t * 2.2 - step * 0.12);
    fx.strokeStyle = "hsla(" + (340 + step * 0.12) + ",75%," + (50 + 8 * wv) + "%," + (0.6 + 0.3 * wv) + ")";
    fx.beginPath();
    fx.moveTo(tipX, tipY);
    fx.lineTo(cx + hx * s, cy - hy * s);
    fx.stroke();
  }
  fx.shadowBlur = 0;

  if(shown >= total && fontReady){
    if(textStart === null) textStart = t + 0.3;
    var p = Math.max(0, Math.min(1, (t - textStart) / 3.6));
    if(p > 0){
      var msg = "LOVE YOU JAWA";
      fx.save();
      fx.font = "700 100px 'Dancing Script', cursive";
      var w100 = fx.measureText(msg).width;
      var fsz = 100 * (21 * s) / w100;
      fx.font = "700 " + fsz + "px 'Dancing Script', cursive";
      var tw = fx.measureText(msg).width;
      var x0 = cx - tw / 2;
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      fx.beginPath(); fx.rect(x0 - 10, 0, (tw + 20) * e, H); fx.clip();
      fx.textAlign = "left"; fx.textBaseline = "middle";
      var ty = cy + 2.5 * s;
      fx.lineJoin = "round"; fx.lineWidth = fsz * 0.08;
      fx.strokeStyle = "rgba(70,0,25,.75)";
      fx.strokeText(msg, x0, ty);
      fx.shadowColor = "#ff2d6f"; fx.shadowBlur = 16;
      fx.fillStyle = "#fff";
      fx.fillText(msg, x0, ty);
      fx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
